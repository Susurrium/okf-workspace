[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "okf-originals-service"
version = "1.0.0"
description = "Authenticated immutable file storage, independent of Vault replication."
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<0.29", "pytest>=8.4,<9", "ruff>=0.12,<1", "pyright>=1.1.403,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/okf_originals_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
