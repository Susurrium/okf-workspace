name: legacy-originals-recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - services/originals/**
      - deploy/server/compose.originals-tailscale.yml
      - deploy/server/install-originals-tailscale.sh
      - scripts/check-legacy-originals.ps1
      - .github/workflows/legacy-originals.yml
  pull_request:
    paths:
      - services/originals/**
      - deploy/server/compose.originals-tailscale.yml
      - deploy/server/install-originals-tailscale.sh
      - scripts/check-legacy-originals.ps1
      - .github/workflows/legacy-originals.yml

permissions:
  contents: read

jobs:
  legacy-originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --project services/originals --locked --extra dev
      - run: uv run --project services/originals pytest services/originals/tests
      - run: uv run --project services/originals ruff check services/originals/src services/originals/tests
      - run: uv run --project services/originals pyright --project services/originals/pyproject.toml
